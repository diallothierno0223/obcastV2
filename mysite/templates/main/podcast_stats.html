{% extends 'base/main.html' %}

{% block content %}
<section class="max-w-7xl mx-auto py-5">

    <h1 class="text-3xl font-bold mb-8 text-center">Les Indicateurs Clés </h1>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-600">
            <div class="flex items-center">
                <div class="p-3 bg-blue-100 rounded-full">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </div>
                <div class="ml-4">
                    <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Total Podcasts</p>
                    <p class="text-2xl font-bold text-gray-900">{{ total_podcasts }}</p>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-orange-500">
            <div class="flex items-center">
                <div class="p-3 bg-orange-100 rounded-full">
                    <svg class="w-6 h-6 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                </div>
                <div class="ml-4">
                    <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Producteurs</p>
                    <p class="text-2xl font-bold text-gray-900">{{ total_producteurs }}</p>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
            <div class="flex items-center">
                <div class="p-3 bg-green-100 rounded-full">
                    <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                </div>
                <div class="ml-4">
                    <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Créateurs</p>
                    <p class="text-2xl font-bold text-gray-900">{{ total_createurs }}</p>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-red-500">
            <div class="flex items-center">
                <div class="p-3 bg-red-100 rounded-full">
                    <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                </div>
                <div class="ml-4">
                    <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Cumul Épisodes</p>
                    <p class="text-2xl font-bold text-gray-900">{{ total_episodes }}</p>
                </div>
            </div>
        </div>

    </div>

    <hr>
    <h1 class="text-3xl font-bold mb-8 text-center">Statistiques descriptives des podcasts</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 py-10">
        <div class="bg-white p-4 shadow rounded-lg">
            <div id="chart-pie" style="width:100%; height:450px;"></div>
        </div>

        <div class="bg-white p-4 shadow rounded-lg">
            <div id="chart-bar-horizontal" style="width:100%; height:450px;"></div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 py-10">
        <div class="bg-white p-4 shadow rounded-lg">
            <div id="chart-natif-pie" style="width:100%; height:450px;"></div>
        </div>

        <div class="bg-white p-4 shadow rounded-lg">
            <div id="chart-duree-box" style="width:100%; height:450px;"></div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 py-10">
        <div class="bg-white p-4 shadow rounded-lg">
            <div id="chart-genre-createur" style="width:100%; height:450px;"></div>
        </div>

        <div class="bg-white p-4 shadow rounded-lg">
            <div id="chart-correlation" style="width:100%; height:450px;"></div>
        </div>
    </div>

    <div class="grid grid-cols-1 gap-8">
        <div id="genreTreemap"></div>
    </div>
</section>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>



<script>
    // Récupération des données injectées par Django
    const dataModeles = {{ modeles_eco_json|safe }};
    const dataProducteurs = {{ top_producteurs_json|safe }};


    // const def  
    const layoutProducteurs = {
        title: 'Top 10 Producteurs',
        margin: {
            l: 150, // Augmente cette valeur (en pixels) selon la longueur des noms
            r: 20,
            t: 50,
            b: 50
        },
        yaxis: {
            autorange: "reversed",
            automargin: true, // Demande à Plotly de calculer l'espace nécessaire
            tickmode: "linear", // Force l'affichage de chaque tick
        },
        xaxis: {
            title: "Nombre de podcasts"
        }
    };


    // --- 1. Donut Chart : Modèle Éco ---
    Plotly.newPlot('chart-pie', [{
        values: dataModeles.map(d => d.count),
        labels: dataModeles.map(d => d.model_eco),
        type: 'pie',
        hole: .4
    }], { title: 'Répartition par Modèle Économique' });

    // bar chart
    Plotly.newPlot('chart-bar-horizontal', [{
        x: dataProducteurs.map(d => d.total),
        y: dataProducteurs.map(d => d.nom),
        type: 'bar',
        orientation: 'h',
        marker: { color: '#1f77b4' } 
    }], layoutProducteurs);

    // --- 3. Stacked Bar Chart : Natif vs Enrichi ---
    const globalData = {{ stats_global_json|safe }};

    // --- Graphique 1 : Pie Chart ---
    const pieTrace = [{
        values: globalData.map(d => d.total),
        labels: globalData.map(d => d.producteur__natif_enrichi),
        type: 'pie',
        hole: 0.4,
        marker: { colors: ['#6366f1', '#a5b4fc'] } // Indigo shades
    }];
    
    Plotly.newPlot('chart-natif-pie', pieTrace, {"title" : "Genre de producteur"});

    var genreData = {{ genres_podcast_json|safe }};

    var data = [{
    type: "treemap",
    labels: genreData.map(d => d.label),
    parents: genreData.map(d => ""), // Pas de hiérarchie ici
    values: genreData.map(d => d.nb_podcasts),
    textinfo: "label+value+percent parent"
    }];

    var layout = { title: "Répartition par Genres de Podcast" };

    Plotly.newPlot('genreTreemap', data, layout);


    // --- 4. Récupération des nouvelles données ---
    const dataGenres = {{ stats_genres_json|safe }};
    const dataCorrelation = {{ correlation_json|safe }};

    // --- 5. Donut Chart : Genre des Créateurs ---
    Plotly.newPlot('chart-genre-createur', [{
        values: dataGenres.map(d => d.total),
        labels: dataGenres.map(d => d.genre),
        type: 'pie',
        hole: .4,
        marker: { 
            colors: ['#3b82f6', '#ec4899', '#10b981', '#f59e0b'] 
        }
    }], { title: 'Genre des Créateurs (Parité)' });

    // --- 6. Scatter Plot : Corrélation Durée vs YouTube ---
    const layoutCorrelation = {
        title: 'Corrélation Durée vs Vues YouTube',
        xaxis: { title: "Durée moyenne (min)" },
        yaxis: { title: "Vues YouTube" },
        hovermode: 'closest'
    };

    Plotly.newPlot('chart-correlation', [{
        x: dataCorrelation.map(d => d.duree_moyenne),
        y: dataCorrelation.map(d => d.audience_youtube_nb_vue),
        text: dataCorrelation.map(d => d.nom), // Affiche le nom au survol
        mode: 'markers',
        type: 'scatter',
        marker: { 
            size: 10,
            color: '#ef4444',
            opacity: 0.6
        }
    }], layoutCorrelation);


    // --- 9. Box Plot : Durée par Genre ---
    const dataDureeGenre = {{ stats_duree_genre_json|safe }};

    const traceDuree = {
        y: dataDureeGenre.map(d => d.duree_moyenne),
        x: dataDureeGenre.map(d => d.genre__label),
        type: 'box',
        name: 'Durée (min)',
        marker: { color: '#10b981' }, // Vert Emeraude
        boxpoints: 'suspectedoutliers' // Affiche les points vraiment bizarres
    };

    const layoutDuree = {
        title: 'Distribution des durées par Genre',
        yaxis: { title: 'Minutes', zeroline: false },
        xaxis: { title: 'Genres', automargin: true },
        boxmode: 'group'
    };

    Plotly.newPlot('chart-duree-box', [traceDuree], layoutDuree);


</script>

{% endblock %}
